# Test-only stand-in for a concrete application's deployment configuration.
# commerce-runtime ships no application.conf; each consuming application supplies its own.
# Non-default values here prove the file is read; everything omitted takes the model's
# defaults. The database block is declared with empty placeholders that the environment
# fills, as a real deployment would.

server {
  port = 8081
}

database {
  jdbcUrl = ""
  username = ""
  password = ""
  maximumPoolSize = 6
}

sessions {
  lifetimeMinutes = 480
}
